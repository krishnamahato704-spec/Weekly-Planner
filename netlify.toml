[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_SITE_URL = "https://weekly-plannerkrissh.netlify.app"
  VITE_MAX_TRANSCRIPTION_BODY_BYTES = "4194304"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "bun run dev"
  targetPort = 3000
  port = 8888
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self' https://chatgpt.com https://chat.openai.com"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
